<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>출고 상세 내역</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <!-- 출고 상세보기 화면 -->
            <div id="outbound-detail">
                <div class="form-container">
                    <h3 style="margin-bottom: 20px; text-align: center;">출고 상세 정보</h3>
                    <div class="form-group">
                        <label>출고번호</label>
                        <div class="info-text" th:text="${outBound.outBoundNo}"></div>
                    </div>

                    <div class="form-group">
                        <label>출고일자</label>
                        <div class="info-text" th:text="${outBound.outboundDate}"></div>
                    </div>

                    <div class="form-group">
                        <label>상품명</label>
                        <div class="info-text" th:text="${outBound.productName}"></div>
                    </div>

                    <div class="form-group">
                        <label>출고수량</label>
                        <div class="info-text" style="background: #f8d7da; color: #721c24; font-weight: bold;" th:text="${outBound.quantity}"></div>
                    </div>

                    <div class="form-group">
                        <label>출고사유</label>
                        <div class="info-text" th:text="${outBound.reason}"></div>
                    </div>

                    <div class="form-group">
                        <label>등록자</label>
                        <div class="info-text" th:text="${outBound.regUserName}"></div>
                    </div>

                    <div class="form-group">
                        <label>등록일시</label>
                        <div class="info-text" th:text="${#temporals.format(outBound.regDate, 'yyyy-MM-dd')}"></div>
                    </div>

                    <div class="form-group">
                        <label>비고</label>
                        <div class="info-text" th:text="${outBound.remarks}"></div>
                    </div>

                    <div class="form-actions">
                        <button class="btn btn-primary btn-cancel" data-screen="outbound-list">확인</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<form id="pageForm">
    <input type="hidden" name="pageNum" th:value="${pagination.pageNum}"/>
</form>

<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">

    const pageForm = $("#pageForm");

    //버튼 이벤트 처리
    function addButtonEvent() {
        $(".btn-cancel").on("click", function (e) {
           e.preventDefault();
           pageForm.attr('action', '/outbound');
           pageForm.submit();
        });
    }

    //init
    $(function () {
       addButtonEvent();
    });
</script>
</body>
</html>
