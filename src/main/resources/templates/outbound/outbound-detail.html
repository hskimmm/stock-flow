<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>출고 상세 내역</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <!-- 출고 상세보기 화면 -->
            <div id="outbound-detail">
                <div class="form-container">
                    <h3 style="margin-bottom: 20px; text-align: center;">출고 상세 정보</h3>

                    <div class="form-group">
                        <label>출고번호</label>
                        <div class="info-text">OUT-20241028-001</div>
                    </div>

                    <div class="form-group">
                        <label>출고일자</label>
                        <div class="info-text">2024-10-28</div>
                    </div>

                    <div class="form-group">
                        <label>상품명</label>
                        <div class="info-text">B제품 (PRD-002)</div>
                    </div>

                    <div class="form-group">
                        <label>출고수량</label>
                        <div class="info-text" style="background: #f8d7da; color: #721c24; font-weight: bold;">50개</div>
                    </div>

                    <div class="form-group">
                        <label>출고사유</label>
                        <div class="info-text">판매</div>
                    </div>

                    <div class="form-group">
                        <label>등록자</label>
                        <div class="info-text">김철수</div>
                    </div>

                    <div class="form-group">
                        <label>등록일시</label>
                        <div class="info-text">2024-10-28 13:20:15</div>
                    </div>

                    <div class="form-group">
                        <label>비고</label>
                        <div class="info-text">정상 출고 처리</div>
                    </div>

                    <div class="form-actions">
                        <button class="btn btn-primary" data-screen="outbound-list">확인</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
