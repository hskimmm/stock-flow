<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta id="_csrf" name="_csrf" th:content="${_csrf.token}">
    <meta id="_csrf_header" name="_csrf_header" th:content="${_csrf.headerName}">
    <title>출고 등록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <!-- 출고 등록 화면 -->
            <div id="outbound-add">
                <div class="form-container">
                    <form id="addOutBoundForm">
                        <div class="form-group">
                            <label class="required">출고일자</label>
                            <input type="date" id="outBoundDate" name="outBoundDate">
                        </div>
                        <div class="form-group">
                            <label class="required">상품선택</label>
                            <select id="product-select" name="productId">
                                <option value="">선택하세요</option>
                                <option th:value="${product.id}" th:data-stock="${product.currentStock}" th:data-unit="${product.unit}" th:each="product : ${products}" th:text="${product.productName + '(' + product.currentStock + product.unit + ')'}">A제품 (현재고: 150개)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <div class="info-text" id="current-stock">상품을 먼저 선택하세요</div>
                        </div>

                        <div class="form-group">
                            <label class="required">출고수량</label>
                            <input type="number" id="quantity" name="quantity" placeholder="0">
                            <div class="hint" style="color: #e74c3c;">※ 출고수량이 현재고량보다 많으면 출고할 수 없습니다</div>
                        </div>

                        <div class="form-group">
                            <label class="required">출고사유</label>
                            <select name="reason">
                                <option value="">선택하세요</option>
                                <option value="판매">판매</option>
                                <option value="폐기">폐기</option>
                                <option value="반품">반품</option>
                                <option value="기타">기타</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>비고</label>
                            <textarea id="remarks" name="remarks" placeholder="추가 정보를 입력하세요"></textarea>
                        </div>
                    </form>
                    <div class="form-actions">
                        <button class="btn btn-primary btn-create">출고 등록</button>
                        <button class="btn btn-cancel" style="background: #95a5a6; color: white;" data-screen="outbound-list">취소</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">

    const csrfToken = $("meta[name='_csrf']").attr('content');
    const csrfHeader = $("meta[name='_csrf_header']").attr('content');

    const addOutBoundForm = $("#addOutBoundForm");
    const outBoundDateInput = $("#outBoundDate");

    //버튼 이벤트 처리
    function addButtonEvent() {
        $(".btn-create").on("click", function (e) {
           e.preventDefault();
           addOutBound();
        });

        $(".btn-cancel").on("click", function (e) {
           e.preventDefault();
           window.location.href = '/outbound';
        });
    }

    //출고등록
    function addOutBound() {
        const formData = new FormData(addOutBoundForm[0]);
        if (validateInputCheck(formData)) {
            $.ajax({
               url: '/outbound',
               method: 'POST',
               data: formData,
               processData: false,
               contentType: false,
               beforeSend: function (xhr) {
                   xhr.setRequestHeader(csrfHeader, csrfToken)
               },
               success: function (response) {
                   if (response.success) {
                       alert(response.message);
                       window.location.href = '/outbound';
                   }
               },
               error: function (xhr, status, error) {
                   let response;
                   try {
                       response = JSON.parse(xhr.responseText);
                   } catch (e) {
                       alert("응답 데이터 처리 중 오류가 발생하였습니다");
                       return e;
                   }

                   let errorMessage = response.message;
                   if (xhr.status === 400) {
                       let errors = response.items;
                       if (errors['outBoundDate']) {
                           alert(errors['outBoundDate']);
                           return false;
                       } else if (errors['productId']) {
                           alert(errors['productId']);
                           return false;
                       } else if (errors['quantity']) {
                           alert(errors['quantity']);
                           return false;
                       } else if (errors['reason']) {
                           alert(errors['reason']);
                           return false;
                       }
                   } else if (xhr.status === 500) {
                       alert(errorMessage)
                       return false;
                   }
               }
            });
        }
    }

    //Input 태그 유효성 검사
    function validateInputCheck(formData) {
        const stockPattern = /^[1-9]\d*$/;
        const stock = $("#product-select").find("option:selected").data('stock');

        for (const [key, value] of formData.entries()) {
            let trimmedValue = value.trim();
            if (value !== trimmedValue) {
                formData.set(key, trimmedValue);
            }

            if (key === 'outBoundDate' && trimmedValue === '') {
                alert("출고일자를 선택하세요");
                return false;
            }

            if (key === 'productId' && trimmedValue === '') {
                alert("출고할 상품을 선택하세요");
                return false;
            }

            if (key === 'productId' && trimmedValue !== '') {
                if (stock <= 0) {
                    alert("현재고량이 0인 상품은 출고할 수 없습니다");
                    return false;
                }
            }

            if (key === 'quantity' && trimmedValue === '') {
                alert("출고 수량을 입력하세요");
                $("#quantity").focus();
                return false;
            }

            if (key === 'quantity' && trimmedValue !== '' && !stockPattern.test(trimmedValue)) {
                alert("출고 수량은 1 이상이어야 합니다");
                $("#quantity").focus();
                return false;
            }

            if (key === 'quantity' && trimmedValue !== '' && stockPattern.test(trimmedValue)) {
                if (trimmedValue > stock) {
                    alert("출고수량이 현재고량보다 많습니다");
                    $("#quantity").focus();
                    return false;
                }
            }

            if (key === 'reason' && trimmedValue === '') {
                alert("출고 사유를 선택하세요");
                $("#reason").focus();
                return false;
            }
        }
        return true;
    }

    //출고일자 초기 세팅(오늘, 과거날짜만 선택가능 미래날짜 X)
    function initOutboundDate() {
        const today = new Date().toISOString().split("T")[0];
        outBoundDateInput.val(today);
        outBoundDateInput.attr('max', today);
    }

    $(function () {
       addButtonEvent();
       initOutboundDate();
    });
</script>
</body>
</html>
