<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 목록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <!-- 통계 화면 -->
            <div id="statistics">
                <div class="filter-bar">
                    <select>
                        <option>기간: 이번달</option>
                        <option>오늘</option>
                        <option>이번주</option>
                        <option>이번달</option>
                        <option>직접선택</option>
                    </select>
                    <input type="month" value="2024-10">
                </div>

                <div class="chart-container">
                    📊 일별 입출고 현황 차트<br>
                    <small>(실제 구현 시 Chart.js 등 사용)</small>
                </div>

                <div class="chart-container">
                    📈 카테고리별 재고 현황 차트<br>
                    <small>(실제 구현 시 파이 차트)</small>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <h4>📋 많이 입고된 상품 TOP 5</h4>
                        <div class="stat-item">
                            <span>A제품</span>
                            <span>500개</span>
                        </div>
                        <div class="stat-item">
                            <span>C제품</span>
                            <span>400개</span>
                        </div>
                        <div class="stat-item">
                            <span>E제품</span>
                            <span>350개</span>
                        </div>
                        <div class="stat-item">
                            <span>D제품</span>
                            <span>300개</span>
                        </div>
                        <div class="stat-item">
                            <span>B제품</span>
                            <span>250개</span>
                        </div>
                    </div>

                    <div class="stat-box">
                        <h4>📋 많이 출고된 상품 TOP 5</h4>
                        <div class="stat-item">
                            <span>B제품</span>
                            <span>300개</span>
                        </div>
                        <div class="stat-item">
                            <span>D제품</span>
                            <span>250개</span>
                        </div>
                        <div class="stat-item">
                            <span>A제품</span>
                            <span>200개</span>
                        </div>
                        <div class="stat-item">
                            <span>E제품</span>
                            <span>150개</span>
                        </div>
                        <div class="stat-item">
                            <span>C제품</span>
                            <span>100개</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
