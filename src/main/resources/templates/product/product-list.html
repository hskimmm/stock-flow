<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta id="_csrf" name="_csrf" th:content="${_csrf.token}">
    <meta id="_csrf_header" name="_csrf_header" th:content="${_csrf.headerName}">
    <title>상품 목록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <!-- 상품 목록 화면 -->
            <div id="product-list">
                <div class="table-header">
                    <button class="btn btn-primary" data-screen="product-add" th:onclick="|location.href='@{/product/add}'|">+ 상품 등록</button>
                    <div class="search-box">
                        <input type="text" placeholder="상품명 검색">
                        <button class="btn btn-primary">검색</button>
                    </div>
                </div>

                <table>
                    <thead>
                    <tr>
                        <th>No</th>
                        <th>상품명</th>
                        <th>카테고리</th>
                        <th>현재고량</th>
                        <th>안전재고</th>
                        <th>상태</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:onclick="|location.href='@{/product/{id}(id=${product.id})}'|" th:each="product : ${products}">
                        <td th:text="${product.id}"></td>
                        <td th:text="${product.productName}"></td>
                        <td th:text="${product.category}"></td>
                        <td th:text="${product.currentStock} + ${product.unit}"></td>
                        <td th:text="${product.safetyStock} + ${product.unit}"></td>
                        <td class="status-normal" th:text="${product.currentStock == 0 ? '없음' : (product.currentStock < product.safetyStock ? '부족' : '정상')}"
                                                    th:class="${ product.currentStock == 0 ? 'status-danger' : (product.currentStock < product.safetyStock ? 'status-warning' : 'status-normal')}"></td>
                        <td>
                            <button class="btn btn-success" style="padding: 5px 10px; margin-right: 5px;">
                                <a class="btn-a" th:href="@{/product/{id}(id=${product.id})}">수정</a>
                            </button>
                            <button class="btn btn-danger btn-delete" style="padding: 5px 10px;" data-type="상품">삭제</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">
</script>
</body>
</html>
