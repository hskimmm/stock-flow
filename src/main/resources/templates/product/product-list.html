<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 목록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <!-- 상품 목록 화면 -->
            <div id="product-list">
                <div class="table-header">
                    <button class="btn btn-primary" data-screen="product-add">+ 상품 등록</button>
                    <div class="search-box">
                        <input type="text" placeholder="상품명 검색">
                        <button class="btn btn-primary">검색</button>
                    </div>
                </div>

                <table>
                    <thead>
                    <tr>
                        <th>No</th>
                        <th>상품명</th>
                        <th>카테고리</th>
                        <th>현재고량</th>
                        <th>안전재고</th>
                        <th>상태</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:onclick="|location.href='@{/product/detail}'|">
                        <td>1</td>
                        <td>A제품</td>
                        <td>전자</td>
                        <td>150개</td>
                        <td>50개</td>
                        <td class="status-normal">정상</td>
                        <td>
                            <button class="btn btn-success" style="padding: 5px 10px; margin-right: 5px;">
                                <a class="btn-a" th:href="@{/product/edit}">수정</a>
                            </button>
                            <button class="btn btn-danger btn-delete" style="padding: 5px 10px;" data-type="상품">삭제</button>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>B제품</td>
                        <td>의류</td>
                        <td>30개</td>
                        <td>50개</td>
                        <td class="status-warning">⚠️ 부족</td>
                        <td>
                            <button class="btn btn-success" style="padding: 5px 10px; margin-right: 5px;" data-screen="product-edit">수정</button>
                            <button class="btn btn-danger btn-delete" style="padding: 5px 10px;" data-type="상품">삭제</button>
                        </td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>C제품</td>
                        <td>식품</td>
                        <td>0개</td>
                        <td>20개</td>
                        <td class="status-danger">🔴 없음</td>
                        <td>
                            <button class="btn btn-success" style="padding: 5px 10px; margin-right: 5px;" data-screen="product-edit">수정</button>
                            <button class="btn btn-danger btn-delete" style="padding: 5px 10px;" data-type="상품">삭제</button>
                        </td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>D제품</td>
                        <td>전자</td>
                        <td>200개</td>
                        <td>100개</td>
                        <td class="status-normal">정상</td>
                        <td>
                            <button class="btn btn-success" style="padding: 5px 10px; margin-right: 5px;" data-screen="product-edit">수정</button>
                            <button class="btn btn-danger btn-delete" style="padding: 5px 10px;" data-type="상품">삭제</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
