<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 목록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <div id="product-add">
                <div class="form-container">
                    <div class="form-group">
                        <label>상품코드</label>
                        <input type="text" value="PRD-AUTO-001" disabled>
                        <div class="hint">자동 생성됩니다</div>
                    </div>

                    <div class="form-group">
                        <label class="required">상품명</label>
                        <input type="text" placeholder="상품명을 입력하세요">
                    </div>

                    <div class="form-group">
                        <label class="required">카테고리</label>
                        <select>
                            <option>선택하세요</option>
                            <option>전자</option>
                            <option>의류</option>
                            <option>식품</option>
                            <option>기타</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>단위</label>
                        <select>
                            <option>개</option>
                            <option>박스</option>
                            <option>kg</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="required">안전재고</label>
                        <input type="number" placeholder="0">
                        <div class="hint">이 수량 이하일 때 알림이 표시됩니다</div>
                    </div>

                    <div class="form-group">
                        <label>초기재고 (선택)</label>
                        <input type="number" placeholder="0">
                        <div class="hint">상품 등록 시 초기 재고량</div>
                    </div>

                    <div class="form-group">
                        <label>비고</label>
                        <textarea placeholder="추가 정보를 입력하세요"></textarea>
                    </div>

                    <div class="form-actions">
                        <button class="btn btn-primary">등록</button>
                        <button class="btn" style="background: #95a5a6; color: white;" data-screen="product-list">취소</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
