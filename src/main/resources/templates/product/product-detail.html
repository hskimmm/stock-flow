<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 목록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <!-- 상품 상세보기 화면 -->
            <div id="product-detail">
                <div class="form-container">
                    <h3 style="margin-bottom: 20px; text-align: center;">상품 상세 정보</h3>

                    <div class="form-group">
                        <label>상품코드</label>
                        <div class="info-text" th:text="${product.productCode}"></div>
                    </div>

                    <div class="form-group">
                        <label>상품명</label>
                        <div class="info-text" th:text="${product.productName}"></div>
                    </div>

                    <div class="form-group">
                        <label>카테고리</label>
                        <div class="info-text" th:text="${product.category}"></div>
                    </div>

                    <div class="form-group">
                        <label>단위</label>
                        <div class="info-text" th:text="${product.unit}"></div>
                    </div>

                    <div class="form-group">
                        <label>안전재고</label>
                        <div class="info-text" th:text="${product.safetyStock}"></div>
                    </div>

                    <div class="form-group">
                        <label>현재재고</label>
                        <div class="info-text" style="background: #d4edda; color: #155724; font-weight: bold;" th:text="${product.currentStock}"></div>
                    </div>

                    <div class="form-group">
                        <label>등록일</label>
                        <div class="info-text" th:text="${#temporals.format(product.regDate, 'yyyyMMdd')}"></div>
                    </div>

                    <div class="form-group">
                        <label>비고</label>
                        <div class="info-text" th:text="${product.remarks}"></div>
                    </div>

                    <h4 style="margin: 30px 0 15px;">최근 입출고 내역</h4>
                    <!-- 입/출고 기능 완료 시 개발 진행 -->
                    [[${history}]]
                    <table>
                        <thead>
                        <tr>
                            <th>일시</th>
                            <th>구분</th>
                            <th>수량</th>
                            <th>담당자</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(inventoryHistory)}">
                            <td colspan="4" style="text-align: center; color: #999; padding: 20px;">
                                최근 입출고 내역이 없습니다.
                            </td>
                        </tr>
                        <tr th:each="history : ${inventoryHistory}">
                            <td th:text="${#temporals.format(history.transactionDate, 'yyyy-MM-dd')}"></td>
                            <td><span th:style="${history.type == 'IN' ? 'color: #3498db' : 'color: #e74c3c'}" th:text="${history.type == 'IN' ? '입고' : '출고'}">입고</span></td>
                            <td th:text="${history.quantity}"></td>
                            <td th:text="${history.regUserName}"></td>
                        </tr>
                        </tbody>
                    </table>

                    <div class="form-actions">
                        <button class="btn btn-primary btn-cancel" data-screen="inventory">확인</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<form id="pageForm">
    <input type="hidden" name="pageNum" th:value="${pagination.pageNum}"/>
</form>

<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">

    const pageForm = $("#pageForm");

    function addButtonEvent() {
        $(".btn-cancel").on("click", function (e) {
           e.preventDefault();
           pageForm.attr('action', '/product');
           pageForm.submit();
        });
    }

    $(function () {
        addButtonEvent();
    })
</script>
</body>
</html>
