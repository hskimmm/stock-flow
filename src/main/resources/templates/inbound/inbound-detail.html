<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>입고 목록 상세보기</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <!-- 입고 상세보기 화면 -->
            <div id="inbound-detail">
                <div class="form-container">
                    <h3 style="margin-bottom: 20px; text-align: center;">입고 상세 정보</h3>
                    <div class="form-group">
                        <label>입고번호</label>
                        <div class="info-text" th:text="${inbound.inboundNo}"></div>
                    </div>

                    <div class="form-group">
                        <label>입고일자</label>
                        <div class="info-text" th:text="${inbound.inboundDate}"></div>
                    </div>

                    <div class="form-group">
                        <label>상품명</label>
                        <div class="info-text" th:text="${inbound.productName}"></div>
                    </div>

                    <div class="form-group">
                        <label>입고수량</label>
                        <div class="info-text" style="background: #d4edda; color: #155724; font-weight: bold;" th:text="${inbound.quantity}"></div>
                    </div>

                    <div class="form-group">
                        <label>공급업체</label>
                        <div class="info-text" th:text="${inbound.supplier}"></div>
                    </div>

                    <div class="form-group">
                        <label>등록자</label>
                        <div class="info-text" th:text="${inbound.regUserId}"></div>
                    </div>

                    <div class="form-group">
                        <label>등록일시</label>
                        <div class="info-text" th:text="${#temporals.format(inbound.regDate, 'yyyy-MM-dd')}"></div>
                    </div>

                    <div class="form-group">
                        <label>비고</label>
                        <div class="info-text" th:text="${inbound.remarks}"></div>
                    </div>

                    <div class="form-actions">
                        <button class="btn btn-primary btn-cancel" data-screen="inbound-list">확인</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<form id="pageForm">
    <input type="hidden" name="pageNum" th:value="${pagination.pageNum}">
</form>

<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">

    const pageForm = $("#pageForm");

    //버튼 이벤트 처리
    function addButtonEvent() {
        $(".btn-cancel").on("click", function (e) {
           e.preventDefault();
           pageForm.attr('action', '/inbound');
           pageForm.submit();
        });
    }

    //init
    $(function () {
       addButtonEvent();
    });
</script>
</body>
</html>
