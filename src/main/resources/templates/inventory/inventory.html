<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>재고 현황</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <!-- 재고 현황 화면 -->
            <div id="inventory">
                <div class="filter-bar">
                    <select>
                        <option>카테고리: 전체</option>
                        <option>전자</option>
                        <option>의류</option>
                        <option>식품</option>
                    </select>
                    <select>
                        <option>재고상태: 전체</option>
                        <option>정상</option>
                        <option>부족</option>
                        <option>없음</option>
                    </select>
                    <div class="search-box">
                        <input type="text" placeholder="상품명 검색">
                        <button class="btn btn-primary">검색</button>
                    </div>
                </div>

                <table>
                    <thead>
                    <tr>
                        <th>No</th>
                        <th>상품명</th>
                        <th>카테고리</th>
                        <th>현재고량</th>
                        <th>안전재고</th>
                        <th>상태</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="status : ${inventories}">
                        <td th:text="${status.id}"></td>
                        <td th:text="${status.productName}"></td>
                        <td th:text="${status.category}"></td>
                        <td th:text="${status.currentStock}"></td>
                        <td th:text="${status.safetyStock}"></td>
                        <td th:text="${status.stockStatus}" th:class="${status.stockStatus == '정상' ? 'status-normal' : (status.stockStatus == '부족' ? 'status-warning' : 'status-danger')}">정상</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
