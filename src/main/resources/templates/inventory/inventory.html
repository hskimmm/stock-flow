<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>재고 현황</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <!-- 재고 현황 화면 -->
            <div id="inventory">
                <div class="filter-bar">
                    <select name="category">
                        <option value="">카테고리: 전체</option>
                        <option value="전자" th:attr="selected=${pagination.category == '전자'}">전자</option>
                        <option value="의류" th:attr="selected=${pagination.category == '의류'}">의류</option>
                        <option value="식품" th:attr="selected=${pagination.category == '식품'}">식품</option>
                        <option value="기타" th:attr="selected=${pagination.category == '기타'}">기타</option>
                    </select>
                    <select name="status">
                        <option value="">재고상태: 전체</option>
                        <option value="정상" th:attr="selected=${pagination.status == '정상'}">정상</option>
                        <option value="부족" th:attr="selected=${pagination.status == '부족'}">부족</option>
                        <option value="없음" th:attr="selected=${pagination.status == '없음'}">없음</option>
                    </select>
                    <div class="search-box">
                        <input type="text" name="keyword" th:value="${pagination.keyword}" placeholder="상품명 검색">
                        <button class="btn btn-primary btn-search">검색</button>
                    </div>
                </div>

                <table>
                    <thead>
                    <tr>
                        <th>No</th>
                        <th>상품명</th>
                        <th>카테고리</th>
                        <th>현재고량</th>
                        <th>안전재고</th>
                        <th>상태</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="status : ${inventories}">
                        <td th:text="${status.id}"></td>
                        <td th:text="${status.productName}"></td>
                        <td th:text="${status.category}"></td>
                        <td th:text="${status.currentStock}"></td>
                        <td th:text="${status.safetyStock}"></td>
                        <td th:text="${status.stockStatus}" th:class="${status.stockStatus == '정상' ? 'status-normal' : (status.stockStatus == '부족' ? 'status-warning' : 'status-danger')}">정상</td>
                    </tr>
                    </tbody>
                </table>
                <!-- 페이징 -->
                <div class="pagination">
                    <div class="page-item" th:if="${page.prev}">
                        <a>Previous</a>
                    </div>
                    <div class="page-item" th:each="num : ${#numbers.sequence(page.startPage, page.endPage)}">
                        <a th:class="${page.pagination.pageNum == num ? 'active' : ''}" th:href="${num}">[[${num}]]</a>
                    </div>
                    <div class="page-item" th:if="${page.next}">
                        <a>Next</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<form id="pageForm">
    <input type="hidden" name="pageNum" th:value="${pagination.pageNum}"/>
    <input type="hidden" name="category" th:value="${pagination.category}"/>
    <input type="hidden" name="status" th:value="${pagination.status}"/>
    <input type="hidden" name="keyword" th:value="${pagination.keyword}"/>
</form>

<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">

    const pageUL = $(".pagination");
    const pageForm = $("#pageForm");

    //버튼 이벤트 처리
    function addButtonEvent() {
        pageUL.on("click", "a", function (e) {
           e.preventDefault();
           let pageNum = $(this).attr('href');
           pageForm.find("input[name='pageNum']").val(pageNum);

           pageForm.attr('action', '/inventory');
           pageForm.submit();
        });

        $(".btn-search").on("click", function (e) {
           e.preventDefault();
           let categoryValue = $("select[name='category']").val();
           let statusValue = $("select[name='status']").val();
           let keywordValue = $("input[name='keyword']").val().trim();

           console.log(categoryValue);
           console.log(statusValue);
           console.log(keywordValue);

           pageForm.find("input[name='pageNum']").val(1);
           pageForm.find("input[name='category']").val(categoryValue);
           pageForm.find("input[name='status']").val(statusValue);
           pageForm.find("input[name='keyword']").val(keywordValue);

           pageForm.attr('action', '/inventory');
           pageForm.submit();
        });
    }

    //init
    $(function () {
       addButtonEvent();
    });
</script>
</body>
</html>
