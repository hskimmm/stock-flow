<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link rel="stylesheet" href="/css/login.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <div class="icon">📦</div>
        <h1>재고관리 시스템</h1>
        <p>Inventory Management System</p>
    </div>

    <div class="error-message" id="error-message" th:if="${error}">
        <span th:text="${error}">아이디 또는 비밀번호가 일치하지 않습니다.</span>
    </div>

    <form th:action="@{/login}" method="post" id="login-form">
        <div class="form-group">
            <label for="userId">아이디</label>
            <input type="text" id="userId" name="userId"
                   placeholder="아이디를 입력하세요"
                   required autofocus>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password"
                   placeholder="비밀번호를 입력하세요"
                   required>
        </div>

        <div class="remember-me">
            <input type="checkbox" id="rememberMe" name="rememberMe">
            <label for="rememberMe">로그인 상태 유지</label>
        </div>

        <button type="submit" class="btn-login">로그인</button>
    </form>

    <div class="login-footer">
        <p>© 2024 Inventory Management System. All rights reserved.</p>
    </div>
</div>

<script>
    $(document).ready(function() {
        // 엔터키로 로그인
        $('#login-form').on('submit', function(e) {
            var userId = $('#userId').val().trim();
            var password = $('#password').val().trim();

            if (!userId) {
                alert('아이디를 입력하세요.');
                e.preventDefault();
                return false;
            }

            if (!password) {
                alert('비밀번호를 입력하세요.');
                e.preventDefault();
                return false;
            }
        });

        // 에러 메시지 자동 숨김 (3초 후)
        if ($('#error-message').length) {
            setTimeout(function() {
                $('#error-message').fadeOut();
            }, 3000);
        }
    });
</script>
</body>
</html>
