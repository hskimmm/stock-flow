<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta id="_csrf" name="_csrf" th:content="${_csrf.token}">
    <meta id="_csrf_header" name="_csrf_header" th:content="${_csrf.headerName}">
    <title>공지사항</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
  <div th:replace="layout/sidebar :: sidebar"></div>
  <div class="main-content">
    <div th:replace="layout/header :: header"></div>
    <div class="content">
        <!-- 공지사항 수정 화면 -->
        <div id="notice-edit" class="screen">
            <div class="form-container" style="max-width: 800px;">
                <h3 style="margin-bottom: 20px; text-align: center;">공지사항 수정</h3>
                <form id="editForm" enctype="multipart/form-data">
                    <input type="hidden" name="noticeId" th:value="${notice.id}"/>
                    <div class="form-group">
                        <label class="required">구분</label>
                        <select name="noticeType">
                            <option value="NORMAL" th:attr="selected=${notice.noticeType == 'NORMAL'}">일반</option>
                            <option value="IMPORTANT" th:attr="selected=${notice.noticeType == 'IMPORTANT'}">중요</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="required">제목</label>
                        <input type="text" id="title" name="title" th:value="${notice.title}">
                    </div>

                    <div class="form-group">
                        <label class="required">내용</label>
                        <textarea style="min-height: 300px;" id="content" name="content">[[${notice.content}]]</textarea>
                    </div>

                    <div class="form-group">
                        <label>파일 첨부</label>
                        <div class="file-upload-area" onclick="document.getElementById('notice-edit-file-input').click()">
                            <input type="file" id="notice-edit-file-input" name="files" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx">
                            <div style="color: #7f8c8d;">
                                📎 클릭하여 파일을 선택하거나 드래그하세요<br>
                                <small>최대 10MB</small>
                            </div>
                        </div>

                        <!-- 기존 첨부파일 -->
                        <div style="margin-top: 15px;">
                            <h5 style="color: #7f8c8d; font-size: 13px; margin-bottom: 10px;">기존 첨부파일</h5>
                            <div class="file-item" th:if="${notice.fileList != null && !notice.fileList.isEmpty()}" th:each="file : ${notice.fileList}">
                                <div class="file-item-name">
                                    <span>📄</span>
                                    <span th:text="${file.originalName}"></span>
                                    <span style="color: #7f8c8d; font-size: 13px;" th:text="${file.fileSize < 1024 ? file.fileSize + ' B' : (file.fileSize < 1048576 ? (#numbers.formatDecimal(file.fileSize / 1024.0, 1, 1) + ' KB') : (file.fileSize < 1073741824 ? (#numbers.formatDecimal(file.fileSize / 1048576.0, 1, 1) + ' MB') : (#numbers.formatDecimal(file.fileSize / 1073741824.0, 1, 1) + ' GB')))}">0 KB</span>
                                </div>
                                <span class="file-item-remove" th:data-file-id="${file.id}" onclick="removeExistingFile(this)">✕</span>
                            </div>
                        </div>

                        <div class="file-list" id="notice-edit-file-list"></div>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="isTop" name="isTop" th:checked="${notice.isTop == 'Y'}" style="width: auto; margin-right: 5px;">
                            상단 고정
                        </label>
                        <div class="hint">체크하면 목록 상단에 항상 표시됩니다</div>
                    </div>

                    <div class="form-group">
                        <label>작성 정보</label>
                        <div class="info-text" th:text="'작성자: ' + ${notice.regUserName} + ' | ' + '작성일: ' + ${#temporals.format(notice.regDate, 'yyyy-MM-dd HH:mm:ss')} + ' | ' + '조회수: ' + ${notice.viewCount}"></div>
                    </div>
                </form>

                <div class="form-actions">
                    <button class="btn btn-primary btn-edit">수정</button>
                    <button class="btn btn-cancel" style="background: #95a5a6; color: white;">취소</button>
                </div>
            </div>
        </div>
    </div>
  </div>
</div>

<form id="pageForm">
    <input type="hidden" name="pageNum" th:value="${pagination.pageNum}"/>
</form>

<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">

    const csrfToken = $("meta[name='_csrf']").attr('content');
    const csrfHeader = $("meta[name='_csrf_header']").attr('content');

    const noticeId = $("input[name='noticeId']").val();

    const pageForm = $("#pageForm");

    let fileList = [];
    let deletedFileIds = [];

    //버튼 이벤트 처리
    function addButtonEvent() {
        $("#notice-edit-file-input").on("change", function () {
            let files = this.files;

            for (let i = 0; i < files.length; i++) {
                fileList.push(files[i]);
            }
            showFileList();
            $(this).val('');
        });

        $(".btn-edit").on("click", function (e) {
           e.preventDefault();
           editNotice();
        });

        $(".btn-cancel").on("click", function (e) {
           e.preventDefault();
           pageForm.attr('action', `/notice/${noticeId}`);
           pageForm.submit();
        });
    }

    //공지사항 수정
    function editNotice() {
        let noticeType = $("select[name='noticeType']").val();
        let title = $("#title").val();
        let content = $("#content").val();

        if (!noticeType) {
            alert("구분을 선택하세요");
            return;
        }

        if (!title) {
            alert("제목을 입력하세요");
            $("#title").focus();
            return;
        }

        if (title.length > 200) {
            alert("제목은 200자 이내로 입력하세요");
            $("#title").focus();
            return;
        }

        if (!content) {
            alert("내용을 입력하세요");
            $("#content").focus();
            return;
        }

        let totalSize = 0;
        for (let i = 0; i < fileList.length; i++) {
            totalSize += fileList[i].size;
        }

        if (totalSize > 10 * 1024 * 1024) {
            alert("전체 파일 크기는 10MB를 초과할 수 없습니다.");
            return;
        }

        const formData = new FormData();
        formData.append("id", noticeId);
        formData.append("noticeType", noticeType);
        formData.append("title", title);
        formData.append("content", content);
        formData.append("isTop", $("#isTop").is(":checked") ? "Y" : "N");

        //삭제할 파일 ID
        if (deletedFileIds.length > 0) {
            deletedFileIds.forEach(function(fileId) {
                formData.append("deletedFileIds", fileId);
            });
        }

        //새로 추가할 파일
        fileList.forEach(function (file) {
           formData.append("files", file);
        });

        $.ajax({
           url: '/notice',
           method: 'PUT',
           data: formData,
           processData: false,
           contentType: false,
           beforeSend: function (xhr) {
               xhr.setRequestHeader(csrfHeader, csrfToken)
           },
           success: function (response) {
               if (response.success) {
                   alert(response.message);
                   pageForm.attr('action', `/notice/${noticeId}`);
                   pageForm.submit();
               }
           },
           error: function (xhr, status, error) {
               let response;
               try {
                   response = JSON.parse(xhr.responseText);
               } catch (e) {
                   alert("응답 데이터 처리 중 오류가 발생하였습니다");
                   return e;
               }

               let errorMessage = response.message;
               if (xhr.status === 400) {
                   let errors = response.items;
                   if (errors['id']) {
                       alert(errors['id']);
                       return false;
                   } else if (errors['noticeType']) {
                       alert(errors['noticeType']);
                       return false;
                   } else if (errors['title']) {
                       alert(errors['title']);
                       $("#title").focus();
                       return false;
                   } else if (errors['content']) {
                       alert(errors['content']);
                       $("#content").focus();
                       return false;
                   }
               } else if (xhr.status === 500) {
                   alert(errorMessage);
               }
           }
        });
    }

    //파일 목록 표시
    function showFileList() {
        $("#notice-edit-file-list").empty();

        for (let i = 0; i < fileList.length; i++) {
            let file = fileList[i];
            let size = (file.size / 1024).toFixed(1) + "KB";

            let html = '<div class="file-item">';
            html += '<div class="file-item-name">';
            html += '<span>📄</span>';
            html += '<span>' + file.name + '</span>';
            html += '<span style="color:#7f8c8d; font-size:13px;">' + size + '</span>';
            html += '</div>';
            html += '<span class="file-item-remove" onclick="removeNewFile(' + i + ')">✕</span>';
            html += '</div>';

            $("#notice-edit-file-list").append(html);
        }
    }

    //새 파일 삭제
    function removeNewFile(index) {
        fileList.splice(index, 1);
        showFileList();
    }

    //기존 파일 삭제
    function removeExistingFile(element) {
        let fileId = $(element).data('file-id');
        deletedFileIds.push(fileId);
        $(element).closest(".file-item").remove();
    }

    //init
    $(function () {
       addButtonEvent();
    });
</script>
</body>
</html>
