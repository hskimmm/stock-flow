<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>공지사항</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
  <div th:replace="layout/sidebar :: sidebar"></div>
  <div class="main-content">
    <div th:replace="layout/header :: header"></div>
    <div class="content">
        <!-- 공지사항 수정 화면 -->
        <div id="notice-edit" class="screen">
            <div class="form-container" style="max-width: 800px;">
                <h3 style="margin-bottom: 20px; text-align: center;">공지사항 수정</h3>

                <div class="form-group">
                    <label class="required">구분</label>
                    <select>
                        <option>일반</option>
                        <option>안내</option>
                        <option selected>긴급</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="required">제목</label>
                    <input type="text" value="📌 시스템 정기 점검 안내 (10/31)">
                </div>

                <div class="form-group">
                    <label class="required">내용</label>
                    <textarea style="min-height: 300px;">안녕하세요. 재고관리 시스템 관리자입니다.

시스템 안정성 향상 및 신규 기능 추가를 위해 아래와 같이 정기 점검을 실시합니다.

■ 점검 일시
- 2024년 10월 31일 (목) 02:00 ~ 06:00 (약 4시간)

■ 점검 내용
- 시스템 서버 업그레이드
- 데이터베이스 최적화
- 보안 패치 적용

■ 영향 범위
- 점검 시간 동안 시스템 전체 서비스 이용 불가

⚠️ 점검 시간 전까지 진행 중인 작업을 모두 저장해 주시기 바랍니다.
점검 시간은 작업 진행 상황에 따라 다소 변경될 수 있습니다.

이용에 불편을 드려 죄송하며, 더 나은 서비스로 보답하겠습니다.

감사합니다.</textarea>
                </div>

                <div class="form-group">
                    <label>파일 첨부</label>
                    <div class="file-upload-area" onclick="document.getElementById('notice-edit-file-input').click()">
                        <input type="file" id="notice-edit-file-input" multiple onchange="handleFileSelect(this)">
                        <div style="color: #7f8c8d;">
                            📎 클릭하여 파일을 선택하거나 드래그하세요<br>
                            <small>최대 10MB, 최대 5개 파일</small>
                        </div>
                    </div>

                    <!-- 기존 첨부파일 -->
                    <div style="margin-top: 15px;">
                        <h5 style="color: #7f8c8d; font-size: 13px; margin-bottom: 10px;">기존 첨부파일</h5>
                        <div class="file-item">
                            <div class="file-item-name">
                                <span>📄</span>
                                <span>시스템_점검_상세일정.pdf</span>
                                <span style="color: #7f8c8d; font-size: 12px;">(256 KB)</span>
                            </div>
                            <span class="file-item-remove" onclick="removeFile(this)">✕</span>
                        </div>
                        <div class="file-item">
                            <div class="file-item-name">
                                <span>📄</span>
                                <span>공지사항_이미지.jpg</span>
                                <span style="color: #7f8c8d; font-size: 12px;">(1.2 MB)</span>
                            </div>
                            <span class="file-item-remove" onclick="removeFile(this)">✕</span>
                        </div>
                    </div>

                    <div class="file-list" id="notice-edit-file-list"></div>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" checked style="width: auto; margin-right: 5px;">
                        상단 고정
                    </label>
                    <div class="hint">체크하면 목록 상단에 항상 표시됩니다</div>
                </div>

                <div class="form-group">
                    <label>작성 정보</label>
                    <div class="info-text">
                        작성자: 관리자 | 작성일: 2024-10-28 09:00 | 조회수: 125
                    </div>
                </div>

                <div class="form-actions">
                    <button class="btn btn-primary">수정</button>
                    <button class="btn" style="background: #95a5a6; color: white;" onclick="showScreen('notice-detail')">취소</button>
                </div>
            </div>
        </div>
    </div>
  </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
