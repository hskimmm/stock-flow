<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <!-- 공지사항 상세보기 화면 -->
            <div id="notice-detail" class="screen">
                <div class="form-container" style="max-width: 800px;">
                    <div style="border-bottom: 2px solid #ecf0f1; padding-bottom: 20px; margin-bottom: 20px;">
                        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
                            <span th:style="${notice.noticeType == 'IMPORTANT' ? 'background: #e74c3c; color: white;' : 'background: #3498db; color: white;'} + ' padding: 4px 12px; border-radius: 3px; font-size: 13px;'" th:text="${notice.noticeType == 'IMPORTANT' ? '중요' : '일반'}"></span>
                            <h2 style="margin: 0; flex: 1;" th:text="${notice.title}"></h2>
                        </div>
                        <div style="display: flex; justify-content: space-between; color: #7f8c8d; font-size: 14px;">
                            <div>
                                <span th:text="'작성자: ' + ${notice.regUserName}"></span>
                                <span style="margin: 0 10px;">|</span>
                                <span th:text="'작성일: ' + ${#temporals.format(notice.regDate, 'yyyy-MM-dd HH:mm:ss')}"></span>
                            </div>
                            <div th:text="'조회수: ' + ${notice.viewCount}"></div>
                        </div>
                    </div>

                    <div style="min-height: 300px; line-height: 1.8; padding: 20px 0;">
                        <p th:text="${notice.content}"></p>
                    </div>

                    <!-- 첨부파일 영역 -->
                    <div class="attached-files" th:if="${notice.fileList != null && !notice.fileList.isEmpty()}">
                        <h4 style="margin-bottom: 10px; color: #2c3e50;">📎 첨부파일 (<span th:text="${notice.fileList.size()}"></span>)</h4>
                        <div class="attached-file" th:each="file : ${notice.fileList}">
                            <span>📄</span>
                            <span style="flex: 1;" th:text="${file.originalName}"></span>
                            <span style="color: #7f8c8d; font-size: 13px;" th:text="${file.fileSize < 1024 ? file.fileSize + ' B' : (file.fileSize < 1048576 ? (#numbers.formatDecimal(file.fileSize / 1024.0, 1, 1) + ' KB') : (file.fileSize < 1073741824 ? (#numbers.formatDecimal(file.fileSize / 1048576.0, 1, 1) + ' MB') : (#numbers.formatDecimal(file.fileSize / 1073741824.0, 1, 1) + ' GB')))}">0 KB</span>
                            <button class="btn btn-primary" style="padding: 5px 15px; margin-left: 10px;" th:onclick="|download(${file.id})|">다운로드</button>
                        </div>
                    </div>

                    <!-- 댓글 영역 -->
                    <div class="comment-section">
                        <h4 style="margin-bottom: 20px; color: #2c3e50;">💬 댓글 (3)</h4>

                        <!-- 댓글 작성 -->
                        <div class="comment-write">
                            <textarea placeholder="댓글을 입력하세요"></textarea>
                            <div class="comment-write-actions">
                                <button class="btn btn-primary">댓글 등록</button>
                            </div>
                        </div>

                        <!-- 댓글 목록 -->
                        <div class="comment-list">
                            <div class="comment-item">
                                <div class="comment-header">
                                    <div>
                                        <span class="comment-author">김철수</span>
                                        <span class="comment-date" style="margin-left: 10px;">2024-10-28 10:30</span>
                                    </div>
                                    <div class="comment-actions">
                                        <button>수정</button>
                                        <button>삭제</button>
                                    </div>
                                </div>
                                <div class="comment-content">
                                    점검 시간이 좀 길게 예정되어 있네요. 혹시 더 빨리 끝날 가능성도 있나요?
                                </div>
                            </div>

                            <div class="comment-item">
                                <div class="comment-header">
                                    <div>
                                        <span class="comment-author">관리자</span>
                                        <span style="background: #e74c3c; color: white; padding: 2px 6px; border-radius: 3px; font-size: 11px; margin-left: 5px;">작성자</span>
                                        <span class="comment-date" style="margin-left: 10px;">2024-10-28 11:15</span>
                                    </div>
                                    <div class="comment-actions">
                                        <button>수정</button>
                                        <button>삭제</button>
                                    </div>
                                </div>
                                <div class="comment-content">
                                    작업 상황에 따라 조기 종료 가능성도 있습니다. 진행 상황은 실시간으로 공유드리겠습니다.
                                </div>
                            </div>

                            <div class="comment-item">
                                <div class="comment-header">
                                    <div>
                                        <span class="comment-author">이영희</span>
                                        <span class="comment-date" style="margin-left: 10px;">2024-10-28 14:22</span>
                                    </div>
                                    <div class="comment-actions">
                                        <button>수정</button>
                                        <button>삭제</button>
                                    </div>
                                </div>
                                <div class="comment-content">
                                    안내 감사합니다. 미리 작업 마무리하도록 하겠습니다!
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button class="btn btn-primary" th:onclick="|location.href='@{/notice/edit}'|">수정</button>
                        <button class="btn btn-danger" onclick="confirmDelete('공지사항')">삭제</button>
                        <button class="btn btn-cancel" style="background: #95a5a6; color: white;">목록</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">
    //버튼 이벤트 처리
    function addButtonEvent() {
        $(".btn-cancel").on("click", function (e) {
           e.preventDefault();
           window.location.href = '/notice';
        });
    }

    function download(id) {

    }

    //init
    $(function () {
       addButtonEvent();
    });
</script>
</body>
</html>
