<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta id="_csrf" name="_csrf" th:content="${_csrf.token}">
    <meta id="_csrf_header" name="_csrf_header" th:content="${_csrf.headerName}">
    <title>공지사항</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <!-- 공지사항 상세보기 화면 -->
            <div id="notice-detail" class="screen">
                <div class="form-container" style="max-width: 800px;">
                    <div style="border-bottom: 2px solid #ecf0f1; padding-bottom: 20px; margin-bottom: 20px;">
                        <input type="hidden" name="noticeId" th:value="${notice.id}"/>
                        <input type="hidden" name="regUserId" th:value="${userId}"/>
                        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
                            <span th:style="${notice.noticeType == 'IMPORTANT' ? 'background: #e74c3c; color: white;' : 'background: #3498db; color: white;'} + ' padding: 4px 12px; border-radius: 3px; font-size: 13px;'" th:text="${notice.noticeType == 'IMPORTANT' ? '중요' : '일반'}"></span>
                            <h2 style="margin: 0; flex: 1;" th:text="${notice.title}"></h2>
                        </div>
                        <div style="display: flex; justify-content: space-between; color: #7f8c8d; font-size: 14px;">
                            <div>
                                <span th:text="'작성자: ' + ${notice.regUserName}"></span>
                                <span style="margin: 0 10px;">|</span>
                                <span th:text="'작성일: ' + ${#temporals.format(notice.regDate, 'yyyy-MM-dd HH:mm:ss')}"></span>
                            </div>
                            <div th:text="'조회수: ' + ${notice.viewCount}"></div>
                        </div>
                    </div>

                    <div style="min-height: 300px; line-height: 1.8; padding: 20px 0;">
                        <p th:text="${notice.content}"></p>
                    </div>

                    <!-- 첨부파일 영역 -->
                    <div class="attached-files" th:if="${notice.fileList != null && !notice.fileList.isEmpty()}">
                        <h4 style="margin-bottom: 10px; color: #2c3e50;">📎 첨부파일 (<span th:text="${notice.fileList.size()}"></span>)</h4>
                        <div class="attached-file" th:each="file : ${notice.fileList}">
                            <span>📄</span>
                            <span style="flex: 1;" th:text="${file.originalName}"></span>
                            <span style="color: #7f8c8d; font-size: 13px;" th:text="${file.fileSize < 1024 ? file.fileSize + ' B' : (file.fileSize < 1048576 ? (#numbers.formatDecimal(file.fileSize / 1024.0, 1, 1) + ' KB') : (file.fileSize < 1073741824 ? (#numbers.formatDecimal(file.fileSize / 1048576.0, 1, 1) + ' MB') : (#numbers.formatDecimal(file.fileSize / 1073741824.0, 1, 1) + ' GB')))}">0 KB</span>
                            <button class="btn btn-primary" style="padding: 5px 15px; margin-left: 10px;" th:onclick="|fileDownload(${file.id})|">다운로드</button>
                        </div>
                    </div>

                    <!-- 댓글 영역 -->
                    <div class="comment-section">
                        <h4 style="margin-bottom: 20px; color: #2c3e50;"></h4>

                        <!-- 댓글 작성 -->
                        <div class="comment-write">
                            <textarea id="commentContent" name="commentContent" placeholder="댓글을 입력하세요"></textarea>
                            <div class="comment-write-actions">
                                <button class="btn btn-primary btn-comment-create">댓글 등록</button>
                            </div>
                        </div>

                        <!-- 댓글 목록 -->
                        <div class="comment-list"></div>
                    </div>

                    <div class="form-actions">
                        <button class="btn btn-primary" th:onclick="|location.href='@{/notice/edit/{id}(id=${notice.id}, pageNum=${pagination.pageNum}, keyword=${pagination.keyword})}'|">수정</button>
                        <button class="btn btn-danger btn-delete">삭제</button>
                        <button class="btn btn-cancel" style="background: #95a5a6; color: white;">목록</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<form id="pageForm">
    <input type="hidden" name="pageNum" th:value="${pagination.pageNum}"/>
    <input type="hidden" name="keyword" th:value="${pagination.keyword}"/>
</form>

<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">

    const csrfToken = $("meta[name='_csrf']").attr('content');
    const csrfHeader = $("meta[name='_csrf_header']").attr('content');

    const pageForm = $("#pageForm");
    const commentUL = $(".comment-list");

    const noticeId = $("input[name='noticeId']").val();
    const currentUserId = $("input[name='regUserId']").val();

    //버튼 이벤트 처리
    function addButtonEvent() {
        $(".btn-delete").on("click", function (e) {
           e.preventDefault();
           if (confirm("공지사항을 삭제하시겠습니까?")) {
               deleteNotice();
           }
        });

        $(".btn-cancel").on("click", function (e) {
           e.preventDefault();
           pageForm.attr('action', '/notice');
           pageForm.submit();
        });

        $(".btn-comment-create").on("click", function (e) {
           e.preventDefault();
           createComment();
        });

        $(".comment-list").on("click", ".btn-comment-edit", function (e) {
            const commentItem = $(this).closest('.comment-item');
            const commentId = commentItem.data('comment-id');
            const currentContent = commentItem.find('.comment-content').text().trim();

            commentItem.find('.comment-content').html(`
                <textarea class="edit-textarea" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; min-height: 80px; font-size: 14px; font-family: inherit; line-height: 1.6; resize: vertical;" name="editContent">${currentContent}</textarea>
                <div style="margin-top: 10px; display: flex; justify-content: flex-end; gap: 10px;">
                    <button class="btn btn-primary btn-comment-save" data-comment-id="${commentId}" style="padding: 8px 16px; font-size: 14px;">저장</button>
                    <button class="btn-cancel-edit" style="padding: 8px 16px; border: 1px solid #ddd; background: white; color: #7f8c8d; border-radius: 5px; cursor: pointer; font-size: 14px;">취소</button>
                </div>
            `);

            commentItem.find('.comment-actions').hide();
        });

        $(".comment-list").on("click", ".btn-comment-save", function (e) {
            e.preventDefault();
            let commendId = $(this).data('comment-id');
            let editContent = $("textarea[name='editContent']").val().trim();
            editComment(commendId, editContent);
        });

        $(".comment-list").on("click", ".btn-cancel-edit", function (e) {
            e.preventDefault();
            loadCommentList();
        });

        $(".comment-list").on("click", ".btn-comment-delete", function (e) {
           e.preventDefault();

           if (confirm("댓글을 삭제하시겠습니까?")) {
               let commentId = $(this).data('comment-id');
               deleteComment(commentId);
           }
        });
    }

    //공지사항 삭제
    function deleteNotice() {
        let id = $("input[name='noticeId']").val();

        $.ajax({
           url: `/notice/${id}`,
           method: 'DELETE',
           beforeSend: function (xhr) {
               xhr.setRequestHeader(csrfHeader, csrfToken);
           },
           success: function (response) {
               if (response.success) {
                   alert(response.message);
                   pageForm.attr('action', '/notice');
                   pageForm.submit();
               }
           },
           error: function (xhr, status, error) {
               let response;
               try {
                   response = JSON.parse(xhr.responseText);
               } catch (e) {
                   alert("응답 데이터 처리 중 오류가 발생하였습니다");
                   return e;
               }

               let errorMessage = response.message;
               if (xhr.status === 500) {
                   alert(errorMessage);
               }
           }
        });
    }

    //파일 다운로드
    function fileDownload(id) {
        window.location.href = "/notice/download/" + id;
    }

    //댓글 등록
    function createComment() {
        let userId = $("input[name='regUserId']").val();
        let content = $("textarea[name='commentContent']").val().trim();

        if (!content) {
            alert("댓글 내용을 입력하세요")
            return;
        }

        const data = {
            noticeId : noticeId,
            regUserId : userId,
            content : content
        }

        $.ajax({
           url: '/comment',
           method: 'POST',
           data: JSON.stringify(data),
           contentType: 'application/json',
           beforeSend: function (xhr) {
               xhr.setRequestHeader(csrfHeader, csrfToken);
           },
           success: function (response) {
               if (response.success) {
                   $("#commentContent").val('');
                   loadCommentList();
               }
           },
           error: function (xhr, status, error) {
               let response;
               try {
                   response = JSON.parse(xhr.responseText);
               } catch (e) {
                   alert("응답 데이터 처리 중 오류가 발생하였습니다");
                   return e;
               }

               let errorMessage = response.message;
               if (xhr.status === 400) {
                   let errors = response.items;
                   if (errors['noticeId']) {
                       alert(errors['noticeId']);
                       window.location.href = '/notice';
                       return false;
                   } else if (errors['regUserId']) {
                       alert(errors['regUserId']);
                       window.location.href = '/';
                       return false;
                   } else if (errors['content']) {
                       alert(errors['content']);
                       return false;
                   }
               } else if (xhr.status === 500) {
                   alert(errorMessage);
               }
           }
        });
    }

    //댓글 목록 조회
    function loadCommentList() {
        $.ajax({
           url: `/comment/${noticeId}`,
           method: 'GET',
           success: function (response) {
               if (response.success) {
                   showCommentList(response.data);
               }
           },
           error: function (xhr, status, error) {
               let response;
               try {
                   response = JSON.parse(xhr.responseText);
               } catch (e) {
                   alert("응답 데이터 처리 중 오류가 발생하였습니다");
                   return e;
               }

               let errorMessage = response.message;
               if (xhr.status === 404) {
                   alert(errorMessage);
                   return false;
               } else if (xhr.status === 500) {
                   alert(errorMessage);
                   return false;
               }
           }
        });
    }

    //댓글 HTML 동적 생성
    function showCommentList(data) {
        let str = '';
        let count = 0;
        for (const comment of data) {
            let actionButtons = '';
            console.log(comment);
            console.log(currentUserId);
            if (currentUserId == comment.regUserId) {
                actionButtons = `
                <div class="comment-actions">
                    <button class="btn-comment-edit">수정</button>
                    <button class="btn-comment-delete" data-comment-id="${comment.id}">삭제</button>
                </div>
            `;
            }
            str += `<div class="comment-item" data-comment-id="${comment.id}">
                    <div class="comment-header">
                        <div>
                            <span class="comment-author">${comment.userName}</span>
                            <span class="comment-date" style="margin-left: 10px;">${new Date(comment.regDate).toISOString().slice(0, 19).replace('T', ' ')}</span>
                        </div>
                        ${actionButtons}
                    </div>
                    <div class="comment-content">
                        ${comment.content}
                    </div>
                </div>
                `;
            count++;
        }
        commentUL.html(str);
        $(".comment-section h4").text("💬 댓글 " + "(" + count + ")");
    }

    //댓글 수정
    function editComment(commendId, editContent) {
        if (!editContent) {
            alert("댓글 내용을 입력하세요");
            return false;
        }

        const data = {
            id : commendId,
            content : editContent
        }

        $.ajax({
           url: '/comment',
           method: 'PUT',
           data: JSON.stringify(data),
           contentType: 'application/json',
           beforeSend: function (xhr) {
               xhr.setRequestHeader(csrfHeader, csrfToken);
           },
           success: function (response) {
               if (response.success) {
                   loadCommentList();
               }
           },
           error: function (xhr, status, error) {
               let response;
               try {
                   response = JSON.parse(xhr.responseText);
               } catch (e) {
                   alert("응답 데이터 처리 중 오류가 발생하였습니다");
                   return e;
               }

               let errorMessage = response.message;
               if (xhr.status === 400) {
                   let errors = response.items;
                   if (errors['id']) {
                       alert(errors['id']);
                       return false;
                   } else if (errors['content']) {
                       alert(errors['content']);
                       return false;
                   }
               } else if (xhr.status === 404) {
                   alert(errorMessage);
                   return false;
               } else if (xhr.status === 500) {
                   alert(errorMessage);
                   return false;
               }
           }
        });
    }

    //댓글 삭제
    function deleteComment(id) {
        $.ajax({
           url: '/comment',
           method: 'DELETE',
           data: JSON.stringify(id),
           contentType: 'application/json',
           beforeSend: function (xhr) {
               xhr.setRequestHeader(csrfHeader, csrfToken);
           },
           success: function (response) {
               if (response.success) {
                   alert(response.message);
                   loadCommentList();
               }
           },
           error: function (xhr, status, error) {
               let response;
               try {
                   response = JSON.parse(xhr.responseText);
               } catch (e) {
                   alert("응답 데이터 처리 중 오류가 발생하였습니다");
                   return e;
               }

               let errorMessage = response.message;
               if (xhr.status === 404) {
                   alert(errorMessage);
                   return false;
               } else if (xhr.status === 500) {
                   alert(errorMessage);
                   return false;
               }
           }
        });
    }

    //init
    $(function () {
       addButtonEvent();
       loadCommentList();
    });
</script>
</body>
</html>
