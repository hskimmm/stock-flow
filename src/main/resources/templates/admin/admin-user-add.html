<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta id="_csrf" name="_csrf" th:content="${_csrf.token}">
    <meta id="_csrf_header" name="_csrf_header" th:content="${_csrf.headerName}">
    <title>사용자 추가</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <!-- 사용자 추가 화면 -->
            <div id="admin-user-add">
                <div class="form-container">
                    <h3 style="margin-bottom: 20px; text-align: center;">사용자 추가</h3>

                    <form id="userAddForm">
                        <div class="form-group">
                            <label class="required">아이디</label>
                            <input type="text" id="userId" name="userId" placeholder="아이디를 입력하세요">
                            <div class="hint">영문, 숫자 조합 4~20자</div>
                        </div>

                        <div class="form-group">
                            <label class="required">비밀번호</label>
                            <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요">
                            <div class="hint">영문, 숫자, 특수문자 조합 8자 이상</div>
                        </div>

                        <div class="form-group">
                            <label class="required">비밀번호 확인</label>
                            <input type="password" id="passwordOk" name="passwordOk" placeholder="비밀번호를 다시 입력하세요">
                        </div>

                        <div class="form-group">
                            <label class="required">이름</label>
                            <input type="text" id="userName" name="userName" placeholder="이름을 입력하세요">
                        </div>

                        <div class="form-group">
                            <label class="required">권한</label>
                            <select name="role">
                                <option value="USER">일반</option>
                                <option value="ADMIN">관리자</option>
                            </select>
                        </div>
                    </form>
                    <div class="form-actions">
                        <button class="btn btn-primary btn-create">추가</button>
                        <button class="btn btn-cancel" style="background: #95a5a6; color: white;" data-screen="admin">취소</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<form id="pageForm">
    <input type="hidden" name="pageNum" th:value="${pagination.pageNum}"/>
</form>

<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">

    const csrfToken = $("meta[name='_csrf']").attr('content');
    const csrfHeader = $("meta[name='_csrf_header']").attr('content');

    const userAddForm = $("#userAddForm");
    const pageForm = $("#pageForm");

    //버튼 이벤트 처리
    function addButtonEvent() {
        $(".btn-create").on("click", function (e) {
            e.preventDefault();
            existsUser();
        });

        $(".btn-cancel").on("click", function (e) {
            e.preventDefault();
            pageForm.attr('action', '/admin');
            pageForm.submit();
        });
    }

    //사용자 중복 검사
    function existsUser() {
        const formData = new FormData(userAddForm[0]);

        if (validateInputCheck(formData)) {
            //아이디 중복검사
            let userId = formData.get('userId');
            $.ajax({
                url: '/admin/users/exists',
                method: 'GET',
                data: {userId : userId},
                success: function (response) {
                    if (response.success) {
                        let exists = response.data;
                        if (exists) {
                            alert("이미 사용 중인 아이디입니다. 다른 아이디를 입력하세요");
                            $("#userId").focus();
                            return;
                        }

                        createUser(formData);
                    }

                },
                error: function (xhr, status, error) {
                    let response;
                    try {
                        response = JSON.parse(xhr.responseText);
                    } catch (e) {
                        alert("응답 데이터 처리 중 오류가 발생하였습니다");
                        return e;
                    }

                    let errorMessage = response.message;
                    if (xhr.status === 500) {
                        alert(errorMessage);
                        return false;
                    }
                }
            });
        }
    }

    //사용자 추가
    function createUser(formData) {
        $.ajax({
            url: '/admin',
            method: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            beforeSend: function (xhr) {
                xhr.setRequestHeader(csrfHeader, csrfToken)
            },
            success: function (response) {
                if (response.success) {
                    alert(response.message);
                    window.location.href = '/admin';
                }
            },
            error: function (xhr, status, error) {
                let response;
                try {
                    response = JSON.parse(xhr.responseText);
                } catch (e) {
                    alert("응답 데이터 처리 중 오류가 발생하였습니다");
                    return e;
                }

                let errorMessage = response.message;
                if (xhr.status === 400) {
                    let errors = response.items;
                    if (errors['userId']) {
                        alert(errors['userId']);
                        return false;
                    } else if (errors['password']) {
                        alert(errors['password']);
                        return false;
                    } else if (errors['userName']) {
                        alert(errors['userName']);
                        return false;
                    } else if (errors['role']) {
                        alert(errors['role']);
                        return false;
                    }
                } else if (xhr.status === 500) {
                    alert(errorMessage);
                    return false;
                }
            }
        });
    }

    //Input 태그 유효성 검사
    function validateInputCheck(formData) {
        let userId = formData.get('userId')?.trim() || '';
        let password = formData.get('password')?.trim() || '';
        let passwordOk = formData.get('passwordOk')?.trim() || '';

        const userIdPattern = /^[A-Za-z0-9]{4,20}$/;
        const passwordPattern = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*()_+])[A-Za-z\d!@#$%^&*()_+]{8,}$/;

        for (const [key, value] of formData.entries()) {
            let trimmedValue = value.trim();
            if (value !== trimmedValue) {
                formData.set(key, trimmedValue);
            }

            if (key === 'userId' && trimmedValue === '') {
                $("#userId").focus();
                return false;
            }

            if (key === 'password' && trimmedValue === '') {
                $("#password").focus();
                return false;
            }

            if (key === 'passwordOk' && trimmedValue === '') {
                $("#passwordOk").focus();
                return false;
            }

            if (key === 'userName' && trimmedValue === '') {
                $("#userName").focus();
                return false;
            }
        }

        //아이디 형식 검사
        if (!userIdPattern.test(userId)) {
            alert("아이디는 영문, 숫자 조합 4~20자로 입력해주세요.");
            $("#userId").focus();
            return false;
        }
        //비밀번호 형식 검사
        if (!passwordPattern.test(password)) {
            alert("비밀번호는 영문, 숫자, 특수문자 조합 8자 이상이어야 합니다.");
            $("#password").focus();
            return false;
        }
        //비밀번호 일치 검사
        if (password !== passwordOk) {
            alert("비밀번호와 비밀번호 확인이 일치하지 않습니다.");
            $("#passwordOk").focus();
            return false;
        }

        return true;
    }

    //init
    $(function () {
        addButtonEvent();
    })
</script>
</body>
</html>
