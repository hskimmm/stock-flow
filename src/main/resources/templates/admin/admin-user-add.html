<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta id="_csrf" name="_csrf" th:content="${_csrf.token}">
    <meta id="_csrf_header" name="_csrf_header" th:content="${_csrf.headerName}">
    <title>사용자 추가</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <!-- 사용자 추가 화면 -->
            <div id="admin-user-add">
                <div class="form-container">
                    <h3 style="margin-bottom: 20px; text-align: center;">사용자 추가</h3>

                    <div class="form-group">
                        <label class="required">아이디</label>
                        <input type="text" placeholder="아이디를 입력하세요">
                        <div class="hint">영문, 숫자 조합 4~20자</div>
                    </div>

                    <div class="form-group">
                        <label class="required">비밀번호</label>
                        <input type="password" placeholder="비밀번호를 입력하세요">
                        <div class="hint">영문, 숫자, 특수문자 조합 8자 이상</div>
                    </div>

                    <div class="form-group">
                        <label class="required">비밀번호 확인</label>
                        <input type="password" placeholder="비밀번호를 다시 입력하세요">
                    </div>

                    <div class="form-group">
                        <label class="required">이름</label>
                        <input type="text" placeholder="이름을 입력하세요">
                    </div>

                    <div class="form-group">
                        <label class="required">권한</label>
                        <select>
                            <option>일반</option>
                            <option>관리자</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button class="btn btn-primary">추가</button>
                        <button class="btn" style="background: #95a5a6; color: white;" data-screen="admin">취소</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
