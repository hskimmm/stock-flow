<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta id="_csrf" name="_csrf" th:content="${_csrf.token}">
    <meta id="_csrf_header" name="_csrf_header" th:content="${_csrf.headerName}">
    <title>사용자 수정</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <!-- 사용자 수정 화면 -->
            <div id="admin-user-edit">
                <div class="form-container">
                    <h3 style="margin-bottom: 20px; text-align: center;">사용자 수정</h3>

                    <div class="form-group">
                        <label>아이디</label>
                        <input type="text" value="user01" disabled>
                        <div class="hint">수정할 수 없습니다</div>
                    </div>

                    <div class="form-group">
                        <label>비밀번호 변경</label>
                        <input type="password" placeholder="변경할 비밀번호 (선택)">
                        <div class="hint">변경하지 않으려면 비워두세요</div>
                    </div>

                    <div class="form-group">
                        <label>비밀번호 확인</label>
                        <input type="password" placeholder="비밀번호 확인">
                    </div>

                    <div class="form-group">
                        <label class="required">이름</label>
                        <input type="text" value="김철수">
                    </div>

                    <div class="form-group">
                        <label class="required">권한</label>
                        <select>
                            <option selected>일반</option>
                            <option>관리자</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>등록일</label>
                        <div class="info-text">2024-05-15</div>
                    </div>

                    <div class="form-actions">
                        <button class="btn btn-primary">수정</button>
                        <button class="btn" style="background: #95a5a6; color: white;" data-screen="admin">취소</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
