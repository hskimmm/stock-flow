<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta id="_csrf" name="_csrf" th:content="${_csrf.token}">
    <meta id="_csrf_header" name="_csrf_header" th:content="${_csrf.headerName}">
    <title>사용자 수정</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <!-- 사용자 수정 화면 -->
            <div id="admin-user-edit">
                <div class="form-container">
                    <h3 style="margin-bottom: 20px; text-align: center;">사용자 수정</h3>
                    <form id="userEditForm">
                        <input type="hidden" name="id" th:value="${user.id}"/>
                        <div class="form-group">
                            <label>아이디</label>
                            <input type="text" name="id" th:value="${user.id}" disabled>
                            <div class="hint">수정할 수 없습니다</div>
                        </div>

                        <div class="form-group">
                            <label>비밀번호 변경</label>
                            <input type="password" id="password" name="password" placeholder="변경할 비밀번호 (선택)">
                            <div class="hint">변경하지 않으려면 비워두세요</div>
                        </div>

                        <div class="form-group">
                            <label>비밀번호 확인</label>
                            <input type="password" id="passwordOk" name="passwordOk" placeholder="비밀번호 확인">
                        </div>

                        <div class="form-group">
                            <label class="required">이름</label>
                            <input type="text" id="userName" name="userName" th:value="${user.userName}">
                        </div>

                        <div class="form-group">
                            <label class="required">권한</label>
                            <select name="role">
                                <option value="USER" th:attr="selected=${user.role == 'USER'}">일반</option>
                                <option value="ADMIN" th:attr="selected=${user.role == 'ADMIN'}">관리자</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>등록일</label>
                            <div class="info-text">[[${#temporals.format(user.regDate, 'yyyy-MM-dd')}]]</div>
                        </div>
                    </form>

                    <div class="form-actions">
                        <button class="btn btn-primary btn-edit">수정</button>
                        <button class="btn btn-cancel" style="background: #95a5a6; color: white;" data-screen="admin">취소</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<form id="pageForm">
    <input type="hidden" name="pageNum" th:value="${pagination.pageNum}"/>
</form>

<script th:src="@{/js/app.js}"></script>
<<script th:inline="javascript">

    const csrfToken = $("meta[name='_csrf']").attr('content');
    const csrfHeader = $("meta[name='_csrf_header']").attr('content');

    const userEditForm = $("#userEditForm");
    const pageForm = $("#pageForm");

    //버튼 이벤트 처리
    function addButtonEvent() {
        $(".btn-cancel").on("click", function (e) {
           e.preventDefault();
           pageForm.attr('action', '/admin');
           pageForm.submit();
        });

        $(".btn-edit").on("click", function (e) {
           e.preventDefault();
           editUser();
        });
    }

    //사용자 정보 수정
    function editUser() {
        const formData = new FormData(userEditForm[0]);
        if (validateInputCheck(formData)) {
            $.ajax({
                url: '/admin',
                method: 'PUT',
                data: formData,
                processData: false,
                contentType: false,
                beforeSend: function (xhr) {
                    xhr.setRequestHeader(csrfHeader, csrfToken)
                },
                success: function (response) {
                    if (response.success) {
                        alert(response.message);
                        pageForm.attr('action', '/admin');
                        pageForm.submit();
                    }
                },
                error: function (xhr, status, error) {
                    let response;
                    try {
                        response = JSON.parse(xhr.responseText);
                    } catch (e) {
                        alert("응답 데이터 처리 중 오류가 발생하였습니다");
                        return e;
                    }

                    let errorMessage = response.message;
                    if (xhr.status === 400) {
                        let errors = response.items;
                        if (errors['id']) {
                            alert(errors['id']);
                            return false;
                        } else if (errors['userName']) {
                            alert(errors['userName']);
                            return false;
                        } else if (errors['role']) {
                            alert(errors['role']);
                            return false;
                        }
                    } else if (xhr.status === 500) {
                        alert(errorMessage);
                        return false;
                    }
                }
            })
        }
    }

    //Input 태그 유효성 검사
    function validateInputCheck(formData) {
        let password = formData.get('password')?.trim() || '';
        let passwordOk = formData.get('passwordOk')?.trim() || '';

        const passwordPattern = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*()_+])[A-Za-z\d!@#$%^&*()_+]{8,}$/;

        for (const [key, value] of formData.entries()) {
            let trimmedValue = value.trim();
            if (value !== trimmedValue) {
                formData.set(key, trimmedValue);
            }

            if (key === 'userName' && trimmedValue === '') {
                $("#userName").focus();
                return false;
            }

            if (key === 'password' && trimmedValue !== '') {
                if (!passwordPattern.test(password)) {
                    alert("비밀번호는 영문, 숫자, 특수문자 조합 8자 이상이어야 합니다.");
                    $("#password").focus();
                    return false;
                }
            }

            if (key === 'passwordOk' && trimmedValue !== '') {
                if (password !== passwordOk) {
                    alert("비밀번호와 비밀번호 확인이 일치하지 않습니다.");
                    $("#passwordOk").focus();
                    return false;
                }
            }
        }
        return true;
    }

    //init
    $(function () {
       addButtonEvent();
    });
</script>
</body>
</html>
