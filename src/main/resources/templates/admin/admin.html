<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <!-- 관리자 화면 -->
            <div id="admin">
                <h3 style="margin-bottom: 20px;">사용자 관리</h3>
                <div class="table-header">
                    <button class="btn btn-primary" th:onclick="|location.href='@{/admin/add}'|">+ 사용자 추가</button>
                </div>

                <table>
                    <thead>
                    <tr>
                        <th>No</th>
                        <th>아이디</th>
                        <th>이름</th>
                        <th>권한</th>
                        <th>등록일</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td>1</td>
                        <td>admin</td>
                        <td>홍길동</td>
                        <td><span style="color: #e74c3c; font-weight: bold;">관리자</span></td>
                        <td>2024-01-01</td>
                        <td>
                            <button class="btn btn-success" style="padding: 5px 10px; margin-right: 5px;" th:onclick="|location.href='@{/admin/edit}'|">수정</button>
                            <button class="btn btn-danger btn-delete" style="padding: 5px 10px;" data-type="사용자">삭제</button>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>user01</td>
                        <td>김철수</td>
                        <td>일반</td>
                        <td>2024-05-15</td>
                        <td>
                            <button class="btn btn-success" style="padding: 5px 10px; margin-right: 5px;" data-screen="admin-user-edit">수정</button>
                            <button class="btn btn-danger btn-delete" style="padding: 5px 10px;" data-type="사용자">삭제</button>
                        </td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>user02</td>
                        <td>이영희</td>
                        <td>일반</td>
                        <td>2024-08-20</td>
                        <td>
                            <button class="btn btn-success" style="padding: 5px 10px; margin-right: 5px;" data-screen="admin-user-edit">수정</button>
                            <button class="btn btn-danger btn-delete" style="padding: 5px 10px;" data-type="사용자">삭제</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
