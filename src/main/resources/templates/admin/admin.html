<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta id="_csrf" name="_csrf" th:content="${_csrf.token}">
    <meta id="_csrf_header" name="_csrf_header" th:content="${_csrf.headerName}">
    <title>관리자</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
    <div th:replace="layout/sidebar :: sidebar"></div>
    <div class="main-content">
        <div th:replace="layout/header :: header"></div>
        <div class="content">
            <!-- 관리자 화면 -->
            <div id="admin">
                <div class="table-header">
                    <button class="btn btn-primary" th:onclick="|location.href='@{/admin/add}'|">+ 사용자 추가</button>
                    <div class="search-box">
                        <input type="text" placeholder="사용자 검색">
                        <button class="btn btn-primary">검색</button>
                    </div>
                </div>

                <table>
                    <thead>
                    <tr>
                        <th>No</th>
                        <th>아이디</th>
                        <th>이름</th>
                        <th>권한</th>
                        <th>등록일</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user:${users}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.userId}"></td>
                        <td th:text="${user.userName}"></td>
                        <td><span style="color: #e74c3c; font-weight: bold;" th:text="${user.role}"></span></td>
                        <td th:text="${#temporals.format(user.regDate, 'yyyy-MM-dd')}"></td>
                        <td>
                            <button class="btn btn-success" style="padding: 5px 10px; margin-right: 5px;" th:onclick="|location.href='@{/admin/edit/{id}(id=${user.id})}'|">수정</button>
                            <button class="btn btn-danger btn-delete" style="padding: 5px 10px;" data-type="사용자" th:attr="data-id=${user.id}">삭제</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script th:inline="javascript">

    const csrfToken = $("meta[name='_csrf']").attr('content');
    const csrfHeader = $("meta[name='_csrf_header']").attr('content');

    //버튼 이벤트 처리
    function addButtonEvent() {
        $(".btn-delete").on("click", function (e) {
           e.preventDefault();
           let type = $(this).data('type');
           let id = $(this).data('id');

           if (confirm('정말 이 ' + type + '을(를) 삭제하시겠습니까?\n삭제된 데이터는 복구할 수 없습니다.')) {
               deleteUser(id);
           }
        });
    }

    //사용자 삭제
    function deleteUser(id) {
        $.ajax({
           url: `/admin/${id}`,
           method: 'DELETE',
           beforeSend: function (xhr) {
               xhr.setRequestHeader(csrfHeader, csrfToken)
           },
           success: function (response) {
               if (response.success) {
                   alert(response.message);
                   window.location.href = '/admin';
               }
           },
           error: function (xhr, status, error) {
               let response;
               try {
                   response = JSON.parse(xhr.responseText);
               } catch (e) {
                   alert("응답 데이터 처리 중 오류가 발생하였습니다");
                   return e;
               }

               let errorMessage = response.message;
               if (xhr.status === 404) {
                   alert(errorMessage);
                   return false;
               } else if (xhr.status === 500) {
                   alert(errorMessage);
                   return false;
               }
           }
        });
    }

    //init
    $(function () {
       addButtonEvent();
    });
</script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
